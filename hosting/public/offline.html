<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d6efd">
    <title>Sin conexión | Control de Aula</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: #f8f9fa; color: #212529;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .tarjeta {
            width: 100%; max-width: 420px; background: #fff; border: 1px solid #dee2e6;
            border-radius: 12px; padding: 28px 24px; text-align: center;
            box-shadow: 0 0.125rem 0.5rem rgba(0, 0, 0, 0.08);
        }
        .icono { width: 64px; height: 64px; margin: 0 auto 14px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; color: #6c757d; margin: 0 0 18px; line-height: 1.5; }
        .btn {
            display: block; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #0d6efd;
            font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; margin-top: 10px;
        }
        .btn-primario { background: #0d6efd; color: #fff; }
        .btn-secundario { background: transparent; color: #0d6efd; }
        .respaldo { display: none; margin-top: 18px; padding-top: 16px; border-top: 1px solid #dee2e6; }
        .respaldo small { display: block; font-size: 12px; color: #6c757d; margin-bottom: 4px; }
        @media (prefers-color-scheme: dark) {
            body { background: #181b1f; color: #dee2e6; }
            .tarjeta { background: #212529; border-color: #373b3e; }
            p, .respaldo small { color: #adb5bd; }
            .respaldo { border-color: #373b3e; }
        }
    </style>
</head>
<body>
    <main class="tarjeta">
        <img class="icono" src="assets/icons/icon.svg" alt="Control de Aula">
        <h1>Sin conexión a Internet</h1>
        <p>No se pudo conectar con el servidor del Control de Aula. Revisá los datos móviles o el Wi-Fi y volvé a intentar.</p>

        <button type="button" class="btn btn-primario" onclick="location.reload()">Reintentar</button>

        <div class="respaldo" id="bloqueRespaldo">
            <small>Si el ESP32 sigue conectado a tu Wi-Fi o al hotspot del celular, podés controlarlo de forma directa sin Internet:</small>
            <a class="btn btn-secundario" id="linkRespaldo" href="#">Abrir modo respaldo local del ESP32</a>
        </div>
    </main>

    <script>
        // IP local del ESP32 guardada por el panel la última vez que hubo conexión
        (function () {
            try {
                var ip = localStorage.getItem('control_aula_esp32_ip');
                if (ip && /^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) {
                    var link = document.getElementById('linkRespaldo');
                    link.href = 'http://' + ip + '/';
                    link.textContent = 'Abrir modo respaldo local (' + ip + ')';
                    document.getElementById('bloqueRespaldo').style.display = 'block';
                }
            } catch (e) {}
        })();
        // Volver solo cuando vuelva la conexión
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
